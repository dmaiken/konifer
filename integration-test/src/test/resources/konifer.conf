data-store {
  provider = postgresql
  postgresql {
    host = postgres
    port = 5432
    user = konifer_user
    database = konifer
  }
}

object-store {
  provider = s3

  s3 {
    endpoint-url = "http://minio:9000"
    region = "auto"

    # Static credentials
    access-key = "minio_admin"

    force-path-style = true
  }
}

variant-profiles = [
  {
    name = thumbnail-200
    w = 256
    r = auto
  }
]

paths = [
  {
    path = "/**"
    object-store {
      bucket = assets
    }
  }
]
