api {
  rule-evaluation {
    enabled = true
  }
}

data-store {
  provider = postgresql
  postgresql {
    host = postgres
    port = 5432
    user = konifer_user
    database = konifer
  }
}

object-store {
  provider = s3

  s3 {
    endpoint-url = "http://garage:3900"
    region = "garage"

    # Static credentials
    access-key = "GK0123456789abcdef0123456789abcdef"

    force-path-style = true
  }
}

variant-profiles {
  thumbnail-200 {
    w = 256
    r = auto
  }
}

rule-definitions {
  joshua-tree {
    prompts = [
      "a joshua tree",
      "a tree",
      "joshua tree national park"
    ]
    threshold = 0.7
  }
}

paths {
  "/**" {
    object-store {
      bucket = assets
    }
  }
  "/accept/**" {
    upload-ruleset {
      default = reject
      accept-rules = [
        { rule = joshua-tree }
      ]
    }
  }
  "/presigned/**" {
    delivery {
      strategy = presigned

      presigned {
        ttl = 30m
      }
    }
  }
}
