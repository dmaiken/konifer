# Collect all findings before the scripts enforce the misconfiguration threshold.
# License findings remain advisory; scanner and configuration errors still fail.
exit-code: 0
format: json
severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL
timeout: 10m
scan:
  scanners:
    - license
license:
  full: true
  confidence-level: 0.9
image:
  image-config-scanners:
    - misconfig
