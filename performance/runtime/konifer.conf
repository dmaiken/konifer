data-store {
  provider = postgresql
  postgresql {
    host = perf-postgres
    port = 5432
    user = konifer_user
    database = konifer
  }
}

object-store {
  provider = s3

  s3 {
    endpoint-url = "http://perf-minio:9000"
    region = "auto"

    access-key = "minio_admin"

    force-path-style = true
  }
}

http {
  public-url = "http://localhost:8080"
}

rule-definitions {
  performance-landscape {
    prompts = [
      "a canyon landscape",
      "a mountain landscape",
      "a scenic view of cliffs and trees",
      "a wilderness landscape"
    ]
    # The benchmark measures inference, not classifier tuning. An always-match
    # threshold makes the rule-added label a deterministic proof of evaluation.
    threshold = 0.0
  }
}

variant-profiles {
  thumbnail-200 {
    w = 200
    r = auto
    format = webp
  }
  thumbnail-400 {
    w = 400
    r = auto
    format = webp
  }
  thumbnail-600 {
    w = 600
    r = auto
    format = webp
  }
  sepia-original {
    filter = sepia
    r = auto
    format = webp
  }
}

paths {
  "/test-upload-eager-variants/**" {
    transform {
      eager-variants = [
        thumbnail-200,
        thumbnail-400,
        thumbnail-600,
        sepia-original
      ]
    }
  }
  "/test-upload-preprocessing/**" {
    transform {
      preprocessing {
        enabled = true
        r = auto
        format = webp
        pad = 10
      }
    }
  }
  "/test-upload-rules/**" {
    upload-ruleset {
      default = accept
      modify-rules = [
        {
          rule = performance-landscape
          labels = {
            "performance-rule" = "matched"
          }
        }
      ]
    }
  }
  "/test-upload-rules-preprocessing/**" {
    upload-ruleset {
      default = accept
      modify-rules = [
        {
          rule = performance-landscape
          labels = {
            "performance-rule" = "matched"
          }
        }
      ]
    }
    transform {
      preprocessing {
        enabled = true
        r = auto
        format = webp
        pad = 10
      }
    }
  }
}
