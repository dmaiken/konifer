services:
  perf-konifer:
    container_name: perf_konifer
    image: ${KONIFER_IMAGE:-ghcr.io/dmaiken/konifer:latest}
    ports:
      - "8080:8080"
    volumes:
      - ./konifer.conf:/app/config/konifer.conf
      - ../../models/siglip2-base-patch16-224:/app/models/siglip2-base-patch16-224:ro
      - konifer-tmp:/app/tmp
    environment:
      PG_PASSWORD: konifer_password
      S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      perf-postgres:
        condition: service_healthy
      perf-garage:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 8G
    networks:
      - konifer-perf-net
    security_opt:
      - apparmor:unconfined

  perf-postgres:
    image: postgres:17-alpine
    container_name: perf_konifer_postgres
    environment:
      POSTGRES_USER: konifer_user
      POSTGRES_PASSWORD: konifer_password
      POSTGRES_DB: konifer
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konifer_user -d konifer"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 1G
    networks:
      - konifer-perf-net
    security_opt:
      - apparmor:unconfined

  perf-garage:
    image: dxflrs/garage:v2.4.1
    container_name: perf_konifer_garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "3900:3900" # S3 API Port
      - "3903:3903" # Admin API Port
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: assets
    healthcheck:
      # The Garage image is built from scratch (no curl or sh), so invoke /garage directly
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 1G
    networks:
      - konifer-perf-net
    security_opt:
      - apparmor:unconfined

networks:
  konifer-perf-net:
    driver: bridge

volumes:
  konifer-tmp:
  garage-meta:
  garage-data:
