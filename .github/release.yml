changelog:
  exclude:
    labels:
      - duplicate
      - question
      - invalid
    authors:
      - github-actions[bot]
      - dependabot[bot]

  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "💻 Client"
      labels:
        - client
    - title: "📝 Documentation"
      labels:
        - documentation
    - title: "🏠 Housekeeping"
      labels:
        - chore
        - refactor
    - title: "🔄 Other Changes"
      labels:
        - "*"
