name: Dockerfile Misconfiguration Report

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Trivy
        # Same installer revision used by trivy-action v0.36.0.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Scan Dockerfiles
        run: bash scripts/scan-config.sh /tmp/trivy-config-reports

      - name: Upload Dockerfile Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-dockerfiles
          path: /tmp/trivy-config-reports/*.json
          if-no-files-found: warn
          retention-days: 14
