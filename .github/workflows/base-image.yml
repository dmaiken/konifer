name: Build Base Image

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile.base"
      - "scripts/install-vips.sh"
      - "scripts/query-runtime-deps.sh"
      - ".github/workflows/base-image.yml"

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository }}-base
  BASE_CI_IMAGE_NAME: ${{ github.repository }}-base-ci

permissions:
  contents: read
  packages: write

jobs:
  build-runtime:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Arch-Specific Runtime Base Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=base-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-runtime-${{ matrix.arch }}

  merge-runtime:
    runs-on: ubuntu-latest
    needs: build-runtime

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Multi-Arch Base Manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ github.sha }}-arm64

  build-ci:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Arch-Specific CI Base Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          target: ci
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BASE_CI_IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=base-ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-ci-${{ matrix.arch }}

  merge-ci:
    runs-on: ubuntu-latest
    needs: build-ci

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Multi-Arch CI Base Manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.BASE_CI_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.BASE_CI_IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.BASE_CI_IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.BASE_CI_IMAGE_NAME }}:${{ github.sha }}-arm64
