name: Build Base Image

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile.base"
      - "scripts/install-vips.sh"
      - "scripts/native-build/**"
      - "scripts/query-runtime-deps.sh"
      - ".github/workflows/base-image.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Dockerfile.base"
      - "scripts/install-vips.sh"
      - "scripts/native-build/**"
      - "scripts/query-runtime-deps.sh"
      - ".github/workflows/base-image.yml"

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository }}-base
  BASE_CI_IMAGE_NAME: ${{ github.repository }}-base-ci

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Arch-Specific Runtime Base Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          target: runtime
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.arch }}

      - name: Build and Push Arch-Specific CI Base Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          target: ci
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ env.REGISTRY }}/${{ env.BASE_CI_IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.arch }}

  merge:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create Multi-Arch Runtime Base Manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ github.sha }}-arm64

      - name: Create Multi-Arch CI Base Manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.BASE_CI_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.BASE_CI_IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.BASE_CI_IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.BASE_CI_IMAGE_NAME }}:${{ github.sha }}-arm64
