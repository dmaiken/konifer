name: Build and Package Konifer

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docker-compose.yml"
      - ".github/release.yml"
      - ".github/workflows/base-image.yml"
      - "Dockerfile.base"
      - "scripts/install-vips.sh"
      - "scripts/native-build/**"
      - "scripts/query-runtime-deps.sh"
      - "performance/**"
      - ".github/workflows/performance.yml"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docker-compose.yml"
      - ".github/release.yml"
      - ".github/workflows/base-image.yml"
      - "Dockerfile.base"
      - "scripts/install-vips.sh"
      - "scripts/native-build/**"
      - "scripts/query-runtime-deps.sh"
      - "performance/**"
      - ".github/workflows/performance.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BASE_IMAGE_NAME: ${{ github.repository }}-base
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  SIGLIP2_MODEL_REVISION: "ba1f3b0843f24bc5417d38e19c37b287d719b2f4"

permissions:
  contents: read
  packages: read

jobs:
  compile-and-lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-base-ci:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Code and Run Linters
        run: ./gradlew detekt ktlintCheck classes testClasses

  test-client:
    needs: compile-and-lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-base-ci:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6

      - name: Run Client Tests
        run: ./gradlew :client:allTests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  unit-tests:
    needs: compile-and-lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-base-ci:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore SigLIP2 Model Cache
        id: siglip2-cache
        uses: actions/cache@v6
        with:
          path: models/siglip2-base-patch16-224
          key: siglip2-base-patch16-224-${{ env.SIGLIP2_MODEL_REVISION }}

      - name: Run Unit Tests
        run: ./gradlew koverBinaryReport -x :service:functionalTest -x detekt -x ktlintCheck

      - name: Upload Unit Test Coverage Data
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage-data
          path: |
            build/kover/bin-reports/*.ic
            client/build/kover/bin-reports/*.ic
            common/build/kover/bin-reports/*.ic
            service/build/kover/bin-reports/test.ic
          if-no-files-found: error
          retention-days: 1

  functional-tests:
    needs: compile-and-lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-base-ci:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore SigLIP2 Model Cache
        id: siglip2-cache
        uses: actions/cache@v6
        with:
          path: models/siglip2-base-patch16-224
          key: siglip2-base-patch16-224-${{ env.SIGLIP2_MODEL_REVISION }}

      - name: Download SigLIP2 Models
        if: steps.siglip2-cache.outputs.cache-hit != 'true'
        run: bash scripts/download-siglip2-models.sh --revision "$SIGLIP2_MODEL_REVISION"

      - name: Run Functional Tests
        run: ./gradlew :service:functionalTest --no-parallel -Dorg.gradle.workers.max=1 -x detekt -x ktlintCheck --info
        env:
          SVT_LOG: 1

      - name: Upload Functional Test Coverage Data
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-coverage-data
          path: service/build/kover/bin-reports/functionalTest.ic
          if-no-files-found: error
          retention-days: 1

      - name: Report Memory State After Failure
        if: ${{ failure() }}
        run: |
          free -h
          for file in memory.max memory.peak memory.current memory.events; do
            path="/sys/fs/cgroup/$file"
            if test -r "$path"; then
              echo "$file: $(tr '\n' ' ' < "$path")"
            fi
          done

      - name: Upload Functional Test Reports After Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-reports
          path: |
            service/build/test-results/functionalTest
            service/build/reports/tests/functionalTest
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    needs: [ unit-tests, functional-tests ]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-base-ci:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6

      - name: Download Unit Test Coverage Data
        uses: actions/download-artifact@v8
        with:
          name: unit-test-coverage-data
          path: .

      - name: Download Functional Test Coverage Data
        uses: actions/download-artifact@v8
        with:
          name: functional-test-coverage-data
          path: .

      - name: Generate Unified Coverage Report
        run: ./gradlew koverXmlReport -x test -x jvmTest -x functionalTest -x detekt -x ktlintCheck

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover/report.xml
          name: codecov-umbrella
          flags: tests
          fail_ci_if_error: true

  build-service:
    needs: [ test-client, coverage ]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-base-ci:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6

      - name: Build Service Fat JAR
        run: ./gradlew :service:shadowJar -x test -x functionalTest -x detekt -x ktlintCheck

      - name: Upload Shadow JAR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: service-shadow-jar
          path: service/build/libs/*-all.jar
          retention-days: 1

  docker-build:
    needs: build-service
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Shadow JAR Artifact
        uses: actions/download-artifact@v8
        with:
          name: service-shadow-jar
          # Places the downloaded JAR right where the Dockerfile expects it
          path: service/build/libs/

      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Arch-Specific Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Build Image Artifact for Integration Tests
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ghcr.io/dmaiken/konifer:latest
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Save Image Artifact
        run: docker save ghcr.io/dmaiken/konifer:latest --output /tmp/konifer-image-${{ matrix.arch }}.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: konifer-${{ matrix.arch }}-image
          path: /tmp/konifer-image-${{ matrix.arch }}.tar
          retention-days: 1

  integration-test:
    needs: docker-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/${{ github.repository }}-base-ci:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore SigLIP2 Model Cache
        id: siglip2-cache
        uses: actions/cache@v6
        with:
          path: models/siglip2-base-patch16-224
          key: siglip2-base-patch16-224-${{ env.SIGLIP2_MODEL_REVISION }}

      - name: Download SigLIP2 Models
        if: steps.siglip2-cache.outputs.cache-hit != 'true'
        run: bash scripts/download-siglip2-models.sh --revision "$SIGLIP2_MODEL_REVISION"

      - name: Verify SigLIP2 Models
        run: |
          test -s models/siglip2-base-patch16-224/vision_model.onnx
          test -s models/siglip2-base-patch16-224/text_model.onnx
          test -s models/siglip2-base-patch16-224/tokenizer.json
          du -sh models/siglip2-base-patch16-224

      - name: Download Image Artifact
        uses: actions/download-artifact@v8
        with:
          name: konifer-${{ matrix.arch }}-image
          path: /tmp

      - name: Load Konifer Docker Image
        run: docker load --input /tmp/konifer-image-${{ matrix.arch }}.tar

      - name: Run Docker Integration Tests
        run: ./gradlew :integration-test:cleanTest :integration-test:integrationTest -x detekt -x ktlintCheck

  merge:
    runs-on: ubuntu-latest
    needs: [ docker-build, integration-test ]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest,enable={{is_default_branch}}

      - name: Create Multi-Arch Manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
