name: Build and Package Konifer

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docker-compose.yml"
      - ".github/release.yml"
      - ".github/workflows/base-image.yml"
      - "Dockerfile.base"
      - "scripts/install-vips.sh"
      - "scripts/query-runtime-deps.sh"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docker-compose.yml"
      - ".github/release.yml"
      - ".github/workflows/base-image.yml"
      - "Dockerfile.base"
      - "scripts/install-vips.sh"
      - "scripts/query-runtime-deps.sh"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BASE_IMAGE_NAME: ${{ github.repository }}-base
  BASE_CI_IMAGE_NAME: ${{ github.repository }}-base-ci
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

permissions:
  contents: read
  packages: read

jobs:
  compile-and-lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-base-ci:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Code and Run Linters
        run: ./gradlew detekt ktlintCheck classes testClasses

  test-client:
    needs: compile-and-lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-base-ci:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/setup-gradle@v5

      - name: Run Client Tests
        run: ./gradlew :client:allTests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  build-service:
    needs: compile-and-lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-base-ci:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/setup-gradle@v5

      - name: Run Unified Tests & Coverage
        run: ./gradlew koverHtmlReport koverXmlReport -x detekt -x ktlintCheck
        env:
          SVT_LOG: 1

      - name: Build Service Fat JAR
        run: ./gradlew :service:shadowJar -x test -x detekt -x ktlintCheck

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover/report.xml
          name: codecov-umbrella
          flags: tests
          fail_ci_if_error: true

      - name: Upload Shadow JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-shadow-jar
          path: service/build/libs/*-all.jar
          retention-days: 1

  docker-build:
    needs: [ test-client, build-service ]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Download Shadow JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: service-shadow-jar
          # Places the downloaded JAR right where your Dockerfile expects it
          path: service/build/libs/

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Arch-Specific Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

  merge:
    runs-on: ubuntu-latest
    needs: docker-build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest,enable={{is_default_branch}}

      - name: Create Multi-Arch Manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
