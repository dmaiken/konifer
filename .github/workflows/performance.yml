name: Validate and Deploy Performance Report

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "performance/**"
      - ".github/workflows/performance.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "performance/**"
      - ".github/workflows/performance.yml"

permissions:
  contents: read

concurrency:
  group: performance-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: performance

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: performance/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate performance project
        run: npm run check

      - name: Stage GitHub Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/performance/report _site/performance/dist _site/performance/history _site/performance/config
          cp report/index.html report/report.css _site/performance/report/
          cp -R dist/report dist/fonts _site/performance/dist/
          cp history/releases.json history/loads.json _site/performance/history/
          cp config/workloads.json config/load.json config/environments.json _site/performance/config/
          cp BENCHMARKING.md _site/performance/

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: performance/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
