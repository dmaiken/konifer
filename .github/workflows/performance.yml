name: Validate Performance Harness

on:
  push:
    branches: [ "main" ]
    paths:
      - "performance/**"
      - ".github/workflows/performance.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "performance/**"
      - ".github/workflows/performance.yml"

permissions:
  contents: read

concurrency:
  group: performance-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: performance

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: performance/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate performance project
        run: npm run check
