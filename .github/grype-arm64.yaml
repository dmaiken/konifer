# Load only after verifying that the scanned image is ARM64.
# CVE-2026-114938 requires x64 AVX-512 VBMI; ARM64 is not affected.
# https://adoptium.net/news/2026/11/temurin-november-2026-cspu-java4shell/
# Remove this exception when ARM64 uses the patched Temurin runtime.
ignore:
  - vulnerability: CVE-2026-114938
    package:
      name: openjdk
      version: 25.0.5+8-LTS
    reason: ARM64 is not affected by the x64 AVX-512 VBMI Base64 intrinsic vulnerability.
